<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather 2.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Weather Forecast</h1>
      <form id="search-bar">
        <input
          type="text"
          placeholder="enter a city..."
          class="enter-city"
          id="city-input"
        />
        <input type="submit" value="🔍" class="search" />
      </form>
    </header>
    <div id="current-container"></div>
    <div id="forecast-container">
      <h3>5-Day Forecast</h3>
      <div class="grid">
        <p class="forecast-day">Thu</p>
        <img class="forecast-icon" src="" alt="icon" />
        <p class="forecast-description">Sunny</p>
        <p class="forecast-high"><span>21</span>°C</p>
        <p class="forecast-low"><span>15</span>°C</p>

        <p class="forecast-day">Fri</p>
        <img class="forecast-icon" src="" alt="icon" />
        <p class="forecast-description">Cloudy</p>
        <p class="forecast-high"><span>21</span>°C</p>
        <p class="forecast-low"><span>15</span>°C</p>
        #

        <p class="forecast-day">Sat</p>
        <img class="forecast-icon" src="" alt="icon" />
        <p class="forecast-description">Rain</p>
        <p class="forecast-high"><span>21</span>°C</p>
        <p class="forecast-low"><span>15</span>°C</p>

        <p class="forecast-day">Sun</p>
        <img class="forecast-icon" src="" alt="icon" />
        <p class="forecast-description">Snow</p>
        <p class="forecast-high"><span>21</span>°C</p>
        <p class="forecast-low"><span>15</span>°C</p>

        <p class="forecast-day">Mon</p>
        <img class="forecast-icon" src="" alt="icon" />
        <p class="forecast-description">Foggy</p>
        <p class="forecast-high"><span>21</span>°C</p>
        <p class="forecast-low"><span>15</span>°C</p>
      </div>
    </div>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/bmsurilla" target="_blank">Bea-Marie</a> and
        is open-sourced on
        <a href="https://github.com/bmsurilla/weather-app2.0" target="_blank"
          >Github</a
        >
        and hosted on
        <a href="https://bea-weather-app.netlify.app/" target="_blank"
          >Netlify.</a
        >
      </p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
