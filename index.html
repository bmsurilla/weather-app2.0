<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather 2.0</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" /> -->

  <body>
    <header>
      <h1 id="title">Weather Forecast</h1>
      <form id="search-bar">
        <input
          type="text"
          placeholder="enter a city..."
          class="enter-city"
          id="city-input"
        />
        <input type="submit" value="🔍" id="search" />
      </form>
    </header>
    <div id="current-container">
      <div class="current-temp">
        <span id="current-temp-value">20 </span>
        <span id="current-temp-unit">°C </span>
        <span id="current-temp-icon">🌥️</span>

        <p id="current-temp-description">
          <span id="current-temp-condition"> Partly Cloudy</span>
          <br />
          <!-- H: <span id="current-temp-high">20</span>°C L:
          <span id="current-temp-low">15</span>°C -->
        </p>
      </div>
      <div class="current-city">
        <h2 id="city">Vienna</h2>
        <p id="date">
          <span id="datum">, Nov. 5 2025</span> <br />
          <span id="time">19:02</span>
        </p>
      </div>
      <hr id="current-divider" />
      <ul class="extras">
        <li>Humidity</li>
        <li>Wind</li>
        <li>Feels like</li>

        <li>💧 <span id="extras-humidity">66%</span></li>
        <li>🍃 <span id="extras-wind">14.2 km/h</span></li>
        <li>🌡️ <span id="extras-feels">19°C</span></li>
      </ul>
    </div>
