<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather 2.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Weather Forecast</h1>
      <form id="search-bar">
        <input
          type="text"
          placeholder="enter a city..."
          class="enter-city"
          id="city-input"
        />
        <input type="submit" value="🔍" class="search" />
      </form>
    </header>
    <div id="current-container">
      <div class="current-temp">
        <span id="current-temp-value">20 </span>
        <span id="current-temp-unit">°C </span>
        <span id="current-temp-icon">🌥️</span>
      </div>
      <p id="current-temp-description">
        Partly Cloudy
        <br />
        H: <span id="current-temp-high">20</span>°C L:
        <span id="current-temp-low">15</span>°C
      </p>
      <div>
        <h1 id="city">Vienna</h1>
        <p id="date">Wednesday, Nov.5 2025 <br />19:02</p>
      </div>
      <hr />
      <ul class="extras">
        <li>
          Humidity
          <br />
          💧 <strong>66%</strong>
        </li>
        <li>
          Wind
          <br />
          🍃 <strong>14.2 m/s</strong>
        </li>
        <li>
          Feels like
          <br />
          🌡️ <strong>19°C</strong>
        </li>
      </ul>
    </div>
