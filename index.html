<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather 2.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Weather Forecast</h1>
      <form id="search-bar">

        <input type="submit" value="🔍" class="search" />
      </form>
    </header>
    <div id="current-container"></div>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/bmsurilla" target="_blank">Bea-Marie</a> and
        is open-sourced on
        <a href="https://github.com/bmsurilla/weather-app2.0" target="_blank"
          >Github</a
        >
        and hosted on
        <a href="https://bea-weather-app.netlify.app/" target="_blank"
          >Netlify</a
        >
      </p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
